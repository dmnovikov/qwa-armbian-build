# NAPI-Switch: keep NetworkManager off the DSA conduit (see
# /etc/systemd/network/05-trunk0.network for networkd).  Armbian's netplan hands
# every ethernet to NM, which then runs DHCP on trunk0 every 45 s.  This file
# has to be in place before NM starts: unmanaging trunk0 at runtime makes NM
# set it down, which cuts the CPU off the switch until reboot.
# "+=" so napi-switchd can add the WAN NIC in its own file.
[keyfile]
unmanaged-devices+=interface-name:trunk0
