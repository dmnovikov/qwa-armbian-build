# Sound.
REMOVE_PACKAGES=(
	alsa-utils alsa-tools alsa-ucm-conf alsa-topology-conf
	pulseaudio pulseaudio-utils
	pipewire pipewire-bin pipewire-pulse pipewire-alsa wireplumber

	# Wi-Fi and Bluetooth.
	iw wpasupplicant wireless-regdb wireless-tools rfkill
	bluetooth bluez bluez-tools bluez-obexd

	# Display and output decoration.
	plymouth plymouth-themes fbset figlet toilet qrencode

	# Manuals and optional package search tools.
	man-db manpages manpages-dev apt-file aptitude command-not-found
)

# Keep the editor, board tools, and core system packages.
KEEP_PACKAGES=(
	nano vim net-tools can-utils mbpoll minicom tcpdump screen memtester xxd tree
	util-linux-extra mosquitto mosquitto-clients i2c-tools python3-pymodbus python3-pip
	python3-smbus2 git tmux make cmake gcc build-essential flex bison libssl-dev pkg-config
	mbusd gpiod
	apt dpkg bash systemd systemd-sysv udev openssh-server sudo iproute2
	e2fsprogs util-linux initramfs-tools
)

# Remove manual pages and prevent installation during package updates.
REMOVE_MAN_PAGES=yes

# Keep firmware for USB Ethernet, USB serial ports, and USB card readers.
PRUNE_FIRMWARE=yes
KEEP_FIRMWARE=(
	'rtl_nic/*' 'kaweth/*' 'asix/*'
	'edgeport/*' 'keyspan/*' 'keyspan_pda/*' 'moxa/*'
	'ti_3410.fw*' 'ti_5052.fw*' 'mts_*.fw*' 'whiteheat*.fw*'
	'ene-ub6250/*'
	'LICENCE*' 'LICENSE*' 'WHENCE'
)

# RK3308 has no PCIe, SATA, NVMe, UFS, or USB 3 controller.
KERNEL_DISABLE=(
	SOUND BT RFKILL WIRELESS WLAN CFG80211 MAC80211
	DRM DRM_ACCEL FB FB_TFT MEDIA_SUPPORT
	PCI ATA BLK_DEV_NVME NVME_CORE NVME_TARGET
	NVME_FABRICS NVME_FC NVME_TCP NVME_RDMA SCSI_UFSHCD
	USB_XHCI_HCD USB_DWC3
)

# Keep USB disks after disabling SATA, which previously selected SCSI.
KERNEL_ENABLE=(SCSI BLK_DEV_SD USB_STORAGE)
